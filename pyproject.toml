[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proyectocli"
version = "0.1.0"
description = "Compilador generador de proyectos desde DSL GenSoft/SCF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "antlr4-python3-runtime>=4.13.0",
    "typer>=0.10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[project.scripts]
proyectocli = "cli:app"

[tool.setuptools]
py-modules = ["cli", "proyectocli"]

[tool.setuptools.packages.find]
include = ["compiler*", "lexer*", "optimizer*", "semantic*", "grammar*", "Parser*"]
